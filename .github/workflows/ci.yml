name: CI

# `pull_request`, deliberately **not** `pull_request_target`. This workflow checks
# out and executes the PR's own code, so it must run with the fork's read-only
# token and no access to secrets.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing by default; each job grants only what it needs.
permissions: {}

env:
  # Git hooks serve no purpose in CI; the commitlint job checks messages explicitly.
  HUSKY: 0

jobs:
  quality:
    name: Lint, format, typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: dotnet/global.json

      - run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      # The schema is the source of truth for both generated model packages, and the C# emitter is
      # hand-written -- it will happily emit code that does not compile if the schema grows a
      # construct it has no branch for. This turns those constraints into a readable failure here
      # rather than a compiler error inside a generated file nobody is meant to read.
      - name: Lint the specification
        run: npm run spec:lint

      # `--` inside an XML comment is illegal, and MSBuild refuses to load the project rather than
      # warning. It has broken this repository three times; it is a gate now rather than a habit.
      - name: Check XML comments
        run: npm run xml:check

      # The model types in both languages are generated from spec/v1/sql-schema.json. A spec edited
      # without regenerating leaves the published types describing a document shape that no longer
      # exists -- and these packages are consumed by other people's builds.
      - name: Check the generated sources are current
        run: npm run codegen:check

      # This cannot see dotnet/src/CairnTool.SqlSchema/Generated/Models.cs -- the
      # <auto-generated /> header makes dotnet format skip it. Style for that file is enforced by
      # scripts/codegen.mjs instead. This gate covers the hand-written C#.
      - name: C# format (K&R braces)
        run: npm run format:csharp:check

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  fixtures:
    name: Build fixture dacpacs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # 8.0.x because spec/fixtures/global.json pins it: Microsoft.Build.Sql 0.1.12-preview is what
      # the consuming estate uses, and the fixture's job is to be the estate. 10.0.x because the
      # repository's own projects build on it.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - run: npm ci

      - name: Build every fixture SQL project
        run: npm run fixtures

      # Published once here so the jobs that consume them do not each pay for a sqlproj build.
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: fixtures
          path: artifacts/fixtures
          retention-days: 5

  test-node:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x", "26.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

  test-dotnet:
    name: Test (.NET)
    runs-on: ubuntu-latest
    needs: fixtures
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: dotnet/global.json

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fixtures
          path: artifacts/fixtures

      - name: Run tests
        run: dotnet test dotnet/SqlSchema.slnx --configuration Release

  conformance:
    name: Cross-language conformance
    runs-on: ubuntu-latest
    needs: fixtures
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: dotnet/global.json

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fixtures
          path: artifacts/fixtures

      - run: npm ci
      - run: npm run build

      # Order matters. `dotnet test` writes artifacts/dotnet; `npm test` reads those and writes
      # artifacts/node; `npm run conformance` diffs the two against the goldens. Running the Node
      # suite first would leave it with nothing to reconstruct.
      - run: dotnet test dotnet/SqlSchema.slnx --configuration Release

      # The flag makes the Node suite assert it actually had documents to reconstruct. Without it a
      # conformance run with no artifacts would skip silently and report success.
      - run: npm test
        env:
          SQL_SCHEMA_REQUIRE_CONFORMANCE: "1"

      - name: Diff both languages against the goldens
        run: npm run conformance

      - name: Check every declared member is exercised by a golden
        run: npm run coverage

  msbuild-integration:
    name: MSBuild integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Windows because path quoting in the Exec command is a real failure mode there, and ARM
        # because that is where the SDK's own tasks run in-process rather than through
        # TaskHostFactory -- the case the Exec design exists to be immune to.
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - run: npm ci

      - name: Build a SQL project against the packed MSBuild package
        run: npm run msbuild:check

  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Validate PR commits
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
