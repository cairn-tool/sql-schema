name: CI

# `pull_request`, deliberately **not** `pull_request_target`. This workflow checks
# out and executes the PR's own code, so it must run with the fork's read-only
# token and no access to secrets.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing by default; each job grants only what it needs.
permissions: {}

env:
  # Git hooks serve no purpose in CI; the commitlint job checks messages explicitly.
  HUSKY: 0

jobs:
  quality:
    name: Lint, format, typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: dotnet/global.json

      - run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      # The schema is the source of truth for both generated model packages, and the C# emitter is
      # hand-written -- it will happily emit code that does not compile if the schema grows a
      # construct it has no branch for. This turns those constraints into a readable failure here
      # rather than a compiler error inside a generated file nobody is meant to read.
      - name: Lint the specification
        run: npm run spec:lint

      # The model types in both languages are generated from spec/v1/sql-schema.json. A spec edited
      # without regenerating leaves the published types describing a document shape that no longer
      # exists -- and these packages are consumed by other people's builds.
      - name: Check the generated sources are current
        run: npm run codegen:check

      # This cannot see dotnet/src/CairnTool.SqlSchema/Generated/Models.cs -- the
      # <auto-generated /> header makes dotnet format skip it. Style for that file is enforced by
      # scripts/codegen.mjs instead. This gate covers the hand-written C#.
      - name: C# format (K&R braces)
        run: npm run format:csharp:check

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  test-node:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x", "26.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

  test-dotnet:
    name: Test (.NET)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: dotnet/global.json

      - name: Run tests
        run: dotnet test dotnet/SqlSchema.slnx --configuration Release

  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Validate PR commits
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
