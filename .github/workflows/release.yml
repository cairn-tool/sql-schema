name: Release

# Gated on CI rather than on push. Waiting for CI means the whole support matrix
# has passed first -- including the Windows and ARM MSBuild integration jobs,
# which are the ones most likely to catch a packaging mistake -- and it lets this
# job skip re-running the tests.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  # `npm ci` runs `prepare: husky`, which would install the commit-msg hook into
  # the runner's checkout -- and that hook would then reject semantic-release's
  # own release commit. Git hooks have no purpose in CI.
  HUSKY: 0

jobs:
  release:
    name: Publish npm and NuGet
    runs-on: ubuntu-latest
    permissions:
      # semantic-release writes the tag, the CHANGELOG commit and the GitHub
      # Release through the built-in GITHUB_TOKEN, so this job needs write.
      contents: write
      # OIDC, for the nuget.org key exchange and npm provenance.
      id-token: write
    # Only for a green CI run on a push to main, not for PR CI runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Explicit ref: a workflow_run checkout otherwise defaults to the
          # default branch tip anyway, and naming it keeps us on a branch rather
          # than a detached HEAD, which semantic-release needs in order to push.
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
          scope: "@cairn-tool"

      # 8.0.x as well as 10.0.x: every package targets net8.0, and packing the
      # MSBuild package publishes the tool for net8.0 as its payload.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # npm >= 11.5.1 is what performs the OIDC exchange, so the client is
      # pinned rather than left to whatever Node bundles.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@12

      - run: npm ci
      - run: npm run build

      # Exchanges this job's OIDC token for a short-lived nuget.org API key under
      # a trusted-publishing policy on the `user` account. The policy is bound to
      # this repository and to this workflow's filename, so renaming this file
      # breaks publishing. There is no stored NuGet secret. `--skip-duplicate` in
      # the publish command makes a re-run safe.
      - name: Log in to nuget.org
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: bstockus

      # ⚠️ NPM_TOKEN is a bootstrap, not the intended path. npm only allows a
      # trusted publisher to be configured on a package that already exists, so
      # @cairn-tool/sql-schema cannot use OIDC until it has been published once.
      # Once it exists: register the trusted publisher against this repository
      # and this workflow filename, then drop NPM_TOKEN and NODE_AUTH_TOKEN
      # below. nuget.org needs no such bootstrap -- its policy admits new
      # package IDs, so all four NuGet packages publish on OIDC from the start.
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: npx semantic-release
